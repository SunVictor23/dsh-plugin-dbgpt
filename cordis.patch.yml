# writes them into the profile's own cordis.patch.yml.
- insert:
    - id: dbgpt
      name: dsh-plugin-dbgpt
      config:
        dbgptHome: /mnt/workspace/sxk_dbgpt/DB-GPT
        llmSource: dsh
